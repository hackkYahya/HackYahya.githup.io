<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تم الاختراق</title>
    <style>
        body {
            background: black;
            color: #ff0000;
            text-align: center;
            padding-top: 8%;
            font-family: 'Courier New';
            overflow: hidden;
        }
        h1 { 
            font-size: 55px; 
            animation: glitch 0.1s infinite; 
        }
        #timer {
            font-size: 150px;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 0 0 40px #ff0000;
            animation: shake 0.08s infinite;
        }
        .hacker-name {
            font-size: 35px;
            color: #00ff00;
            margin-top: 20px;
            text-shadow: 0 0 15px #00ff00;
        }
        @keyframes glitch {
            0% { text-shadow: 4px 0 red, -4px 0 blue; }
            50% { text-shadow: -4px 0 red, 4px 0 blue; }
            100% { text-shadow: 4px 0 red, -4px 0 blue; }
        }
        @keyframes shake {
            0% { transform: translate(2px, 1px); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, 1px); }
        }
        .scan {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, red, #ff0000);
            box-shadow: 0 0 15px red;
            animation: scan 1.2s linear infinite;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>
    <div class="scan"></div>
    <h1>⚠️ تم اختراق جهازك ⚠️</h1>
    <p style="font-size:22px;">جاري سحب جميع البيانات وتشفير الملفات...</p>
    <div id="timer">10</div>
    <div class="hacker-name">تم الاختراق عن طريق: الهاكر يحيى</div>

    <script>
        let time = 10;
        const timer = document.getElementById('timer');
        
        const countdown = setInterval(() => {
            time--;
            timer.innerText = time;
            
            if(time <= 3){
                timer.style.color = '#fff';
                document.body.style.background = '#8b0000';
            }
            
            if(time <= 0){
                clearInterval(countdown);
                document.body.innerHTML = `
                    <h1 style="font-size:90px; color:red; animation: glitch 0.1s infinite;">ACCESS DENIED</h1>
                    <p style="font-size:35px; color:#ff0000;">تم تشفير النظام بنجاح</p>
                    <div class="hacker-name">المهاجم: الهاكر يحيى</div>
                `;
                document.body.style.background = 'black';
            }
        }, 1000);
    </script>
</body>
</html>
